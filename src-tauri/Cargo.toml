[package]
name = "codex-taskbar-quota"
version = "1.0.21"
description = "Codex 任务栏额度组件"
authors = ["fengshi"]
edition = "2021"
license = "MIT"
rust-version = "1.88.0"

[lib]
name = "codex_quota_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "=2.10.1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSCell",
  "NSControl",
  "NSResponder",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSThread"] }
