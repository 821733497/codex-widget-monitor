<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex 任务栏额度</title>
    <link rel="stylesheet" href="/src/taskbar/style.css" />
  </head>
  <body>
    <section id="popup" hidden aria-label="任务栏操作"></section>
    <main id="taskbar" aria-label="Codex 任务栏额度">
      <button id="grip" type="button" aria-label="拖动；双击吸附任务栏" title="拖出自由悬浮，靠近任务栏松手吸附；双击重新吸附">⠿</button>
      <div class="provider">
        <button id="source" type="button" aria-label="切换下一个来源"><span id="site">官方</span><span id="account">Codex</span></button>
        <button id="choose" type="button" aria-label="选择供应商和账户" aria-expanded="false">⌃</button>
      </div>
      <div id="metrics" aria-live="polite"></div>
      <button id="refresh" type="button" aria-label="刷新当前来源" title="刷新">↻</button>
    </main>
    <script type="module" src="/src/taskbar/index.js"></script>
  </body>
</html>
